<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Transformation Readiness — Client Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css">
<style>
:root{
  --navy:#2E3192; --navy-d:#22245f; --gold:#C9A35B; --green:#00A651; --blue:#1CA8DD;
  --ink:#1f2230; --muted:#6b7080; --line:#e6e7ee; --bg:#f5f6fb; --card:#ffffff;
  --red:#C0392B; --amber:#E67E22; --shadow:0 10px 40px rgba(46,49,146,.10);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:
  radial-gradient(1200px 600px at 10% -10%, rgba(28,168,221,.10), transparent 60%),
  radial-gradient(1000px 500px at 100% 0%, rgba(46,49,146,.10), transparent 55%),
  var(--bg);
  min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px}

/* ---------- HEADER ---------- */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--navy),var(--blue));
  display:grid;place-items:center;color:#fff;font-size:22px;box-shadow:var(--shadow)}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.2px}
.brand p{font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------- PROGRESS ---------- */
.progress-shell{position:sticky;top:0;z-index:30;padding:14px 0 10px;
  backdrop-filter:blur(8px);background:linear-gradient(var(--bg),rgba(245,246,251,.4))}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps .seg{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.steps .seg i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--navy),var(--blue));
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.steps .seg.done i{width:100%}
.steps .seg.active i{width:100%}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600}

/* ---------- CARD / PANELS ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:34px 34px 30px;display:none}
.panel.show{display:block;animation:slideUp .55s cubic-bezier(.16,.84,.44,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.8px;color:var(--navy);
  background:rgba(46,49,146,.08);padding:6px 12px;border-radius:99px;margin-bottom:16px}
.panel h2{font-size:25px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px;line-height:1.2}
.panel .sub{color:var(--muted);font-size:15px;margin-bottom:26px;max-width:62ch}

/* ---------- INTRO ---------- */
.hero h2{font-size:34px;line-height:1.12;margin-bottom:14px}
.hero .grad{background:linear-gradient(120deg,var(--navy),var(--blue) 60%,var(--green));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}
.feat .f{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fafbff;
  transition:.3s;animation:pop .5s backwards}
.feat .f:hover{transform:translateY(-4px);border-color:var(--blue);box-shadow:0 10px 24px rgba(28,168,221,.14)}
.feat .f i{font-size:26px;color:var(--blue)}
.feat .f h4{font-size:15px;font-weight:700;margin:10px 0 4px}
.feat .f p{font-size:13px;color:var(--muted);line-height:1.5}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

/* ---------- FORM FIELDS ---------- */
.field{margin-bottom:22px;animation:fadeIn .5s backwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qno{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.4px}
.qtext{font-size:16px;font-weight:600;margin:2px 0 13px;line-height:1.45}
.qtext .opt{color:var(--muted);font-weight:500;font-size:13.5px}
.opts{display:grid;gap:9px}
.opts.cols{grid-template-columns:repeat(2,1fr)}
@media(max-width:560px){.opts.cols{grid-template-columns:1fr}.feat{grid-template-columns:1fr}.wrap{padding:20px 14px 60px}.panel{padding:24px 20px}}
.opt-btn{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;
  padding:13px 15px;cursor:pointer;font-size:14.5px;background:#fff;transition:.18s;user-select:none;font-weight:500}
.opt-btn:hover{border-color:var(--blue);background:#f7fbfe}
.opt-btn .tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
  display:grid;place-items:center;flex-shrink:0;transition:.18s;color:#fff;font-size:13px}
.opt-btn.sel{border-color:var(--navy);background:rgba(46,49,146,.05)}
.opt-btn.sel .tick{background:var(--navy);border-color:var(--navy)}
.opt-btn.radio .tick{border-radius:50%}
input[type=text],input[type=email],input[type=number],textarea,select{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-family:inherit;
  font-size:14.5px;color:var(--ink);background:#fff;transition:.18s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(28,168,221,.12)}
textarea{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 label,.field label.lbl{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* ---------- NAV BUTTONS ---------- */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px}
.btn{border:none;font-family:inherit;font-weight:700;font-size:14.5px;padding:13px 26px;border-radius:12px;
  cursor:pointer;display:inline-flex;align-items:center;gap:9px;transition:.2s}
.btn.primary{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;box-shadow:0 8px 22px rgba(46,49,146,.28)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(46,49,146,.36)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

/* ---------- RESULTS ---------- */
#results .gauge-wrap{display:flex;flex-wrap:wrap;gap:26px;align-items:center;margin:8px 0 30px}
.gauge{position:relative;width:160px;height:160px;flex-shrink:0}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column;text-align:center}
.gauge .val b{font-size:38px;font-weight:800;line-height:1}
.gauge .val span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.rsummary{flex:1;min-width:240px}
.rsummary .tier{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--green)}
.rsummary h3{font-size:24px;font-weight:800;margin:4px 0 8px;letter-spacing:-.4px}
.rsummary p{font-size:14.5px;color:var(--muted)}
.dims{display:grid;gap:14px;margin:8px 0 32px}
.dim{border:1px solid var(--line);border-radius:13px;padding:16px 18px;background:#fff;
  animation:slideUp .5s backwards;display:flex;align-items:center;gap:16px}
.dim .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.dim .body{flex:1}
.dim .body .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.dim .body h4{font-size:15.5px;font-weight:700}
.dim .body .score{font-size:13px;font-weight:700}
.bar{height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.dim .note{font-size:13px;color:var(--muted);margin-top:7px}
.roadmap{margin:10px 0 30px}
.roadmap h3{font-size:19px;font-weight:800;margin-bottom:18px;letter-spacing:-.3px}
.phase{display:flex;gap:16px;position:relative;padding-bottom:22px;animation:fadeIn .5s backwards}
.phase:not(:last-child)::before{content:"";position:absolute;left:19px;top:42px;bottom:0;width:2px;background:var(--line)}
.phase .dot{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--navy),var(--blue));z-index:1}
.phase .pc{flex:1;border:1px solid var(--line);border-radius:13px;padding:14px 17px;background:#fff}
.phase .pc h4{font-size:15.5px;font-weight:700;margin-bottom:3px}
.phase .pc .dur{font-size:12px;color:var(--blue);font-weight:700}
.phase .pc p{font-size:13.5px;color:var(--muted);margin-top:5px}
.recos{display:grid;gap:10px;margin:6px 0 28px}
.reco{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--green);
  background:#f4fbf6;border-radius:0 12px 12px 0;padding:13px 16px;animation:fadeIn .5s backwards}
.reco.risk{border-left-color:var(--red);background:#fdf3f2}
.reco i{font-size:20px;margin-top:1px}
.reco.risk i{color:var(--red)} .reco:not(.risk) i{color:var(--green)}
.reco b{font-size:14.5px;font-weight:700} .reco p{font-size:13px;color:var(--muted)}
.cta{background:linear-gradient(120deg,var(--navy),var(--navy-d));border-radius:16px;padding:28px 30px;color:#fff;margin-top:10px}
.cta h3{font-size:21px;font-weight:800;margin-bottom:6px}
.cta p{font-size:14.5px;opacity:.85;margin-bottom:18px}
.cta .row{display:flex;gap:12px;flex-wrap:wrap}
.cta .btn.gold{background:var(--gold);color:#3a2c08}
.cta .btn.outline{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.3)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);transition:.4s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:10px;height:10px;top:-20px;z-index:80;border-radius:2px;pointer-events:none}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.notice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #f0d9a8;background:#fdf6e7;
  border-radius:13px;padding:15px 17px;margin:4px 0 6px;font-size:14px;line-height:1.5;color:#6b5320}
.notice i{font-size:21px;color:var(--gold);flex-shrink:0;margin-top:1px}
.notice b{font-weight:700;color:#54421a}
/* ---------- PAYMENT ---------- */
.paybox{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin:6px 0 12px}
.payrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
.payrow:last-child{border-bottom:none}
.payrow span{color:var(--muted);width:140px;flex-shrink:0;font-weight:500}
.payrow b{font-weight:700;letter-spacing:.2px}
.payrow #acctNo{font-size:18px;color:var(--navy)}
.payrow.total{background:#f6f7fc}
.payrow.total span{color:var(--ink);font-weight:700}
.payrow.total b{font-size:18px;color:var(--navy)}
.confirm{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;margin:4px 0 4px;cursor:pointer;font-size:14px;background:#fafbff;transition:.18s;line-height:1.45}
.confirm:hover{border-color:var(--blue)}
.confirm input{width:20px;height:20px;flex-shrink:0;margin-top:1px;accent-color:var(--navy);cursor:pointer}
.confirm.shake{animation:shake .45s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.copybtn{margin-left:auto;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-family:inherit;
  font-weight:600;font-size:12.5px;padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.18s}
.copybtn:hover{border-color:var(--navy);background:rgba(46,49,146,.05)}
.payhint{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px;margin-bottom:22px}
.payhint i{color:var(--blue);font-size:17px}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:2px dashed var(--line);border-radius:14px;padding:28px 20px;cursor:pointer;text-align:center;
  color:var(--muted);font-size:14px;font-weight:500;transition:.2s;background:#fafbff}
.upload:hover{border-color:var(--blue);background:#f5fbfe;color:var(--navy)}
.upload i{font-size:30px;color:var(--blue)}
.upload.hasfile{border-color:var(--green);background:#f4fbf6;color:var(--green)}
.upload.hasfile i{color:var(--green)}
.securenote{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:center;margin-top:16px}
.securenote i{font-size:14px}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="logo"><i class="ti ti-rocket"></i></div>
    <div>
      <h1>Digital Transformation Studio</h1>
      <p>Readiness intake for accounting firms · Confidential</p>
    </div>
  </div>

  <div class="progress-shell" id="progressShell" style="display:none">
    <div class="steps" id="steps"></div>
    <div class="pmeta"><span id="stepName">Your firm</span><span id="stepCount">Step 1 of 7</span></div>
  </div>

  <!-- PANELS injected by JS -->
  <div id="panels"></div>

  <div class="foot">Your responses are strictly confidential and used only to prepare your tailored transformation plan.</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG — EDIT THESE ============ */
const CONFIG = {
  /* 1) Create a free form at https://formspree.io, then paste your form ID here.
        It looks like "xayzwqlk". Until you do, submissions run in DEMO mode
        (nothing is sent; you'll just see a confirmation screen). */
  formspreeId: "mnjyrpow",

  /* 2) Consultation fee and bank details shown on the payment step. */
  feeBase: "\u20A6100,000",
  feeVat: "\u20A67,500",
  feeTotal: "\u20A6107,500",
  vatRate: "7.5%",
  bank: { account:"1300577450", name:"Convexity Technologies Ltd", bankName:"Providus Bank" },

  /* 3) Optional: a link where clients upload their receipt (Google Drive upload form,
        Dropbox request, etc.). Leave "" to hide. See notes from your developer. */
  receiptUploadUrl: "https://docs.google.com/forms/d/e/1FAIpQLScJetqstLPOiymun2QvN5WT5yn3zvodLCe3nOCx47XyJOuQIA/viewform",

  /* 4) Where the "Book consultation" button sends people (optional). */
  bookingUrl: ""
};
/* ============================================= */

/* ============ QUESTION MODEL ============ */
/* type: single | multi | text | textarea | fields
   dim: which readiness dimension it scores (tech/people/clients/cyber/ndpa) — intro/goals excluded
   scoring: map option-index -> 1..3 (3 = strong). multi handled specially. */

const SECTIONS = [
  {
    key:"firm", name:"Your firm", icon:"ti-building",
    title:"Let's start with your firm",
    sub:"A few basics so we can tailor everything that follows to your size and services.",
    questions:[
      {id:"firmName", type:"fields", fields:[
        {k:"firmName",label:"Firm name",type:"text",ph:"e.g. Adebayo & Co"},
        {k:"contact",label:"Your name & role",type:"text",ph:"e.g. Jane Doe, Partner"},
        {k:"email",label:"Email",type:"email",ph:"name@firm.com"},
        {k:"phone",label:"Phone",type:"text",ph:"+234 ..."},
        {k:"partners",label:"Number of partners",type:"number",ph:"e.g. 3"},
        {k:"staff",label:"Number of staff",type:"number",ph:"e.g. 12"},
      ]},
      {id:"services", type:"multi", dim:null,
       q:"Which services does your firm offer?", opts:["Audit & assurance","Tax","Bookkeeping / accounting","Payroll","Advisory / consulting","Forensic / investigation"]},
    ]
  },
  {
    key:"tech", name:"Technology", icon:"ti-cloud",
    title:"Your technology today",
    sub:"How modern and connected are the tools your firm runs on right now?",
    questions:[
      {id:"acct", type:"single", dim:"tech", q:"How do you currently do your accounting?",
       opts:["Cloud software (QuickBooks, Xero, Sage, Zoho)","Desktop software on one computer","Spreadsheets (Excel)","Manual / paper","A mix of these"], score:[3,2,2,1,2]},
      {id:"storage", type:"single", dim:"tech", q:"Where do you store client documents?",
       opts:["Secure cloud storage","Office computers / local server","Physical paper files","Scattered across email","A mix"], score:[3,2,1,1,2]},
      {id:"integrate", type:"single", dim:"tech", q:"Do your systems share data, or do staff re-enter the same information in several places?",
       opts:["Systems are well integrated","Some integration","Lots of manual re-entry","Not sure"], score:[3,2,1,1]},
      {id:"manual", type:"multi", dim:"tech", invert:true, q:"Which tasks are still done mostly by hand?",
       opts:["Invoicing","Bank reconciliations","Payroll","Reporting","Client onboarding"], note:"more ticked = lower score"},
      {id:"backup", type:"single", dim:"tech", q:"Are your files backed up automatically?",
       opts:["Yes, automatic & tested","Sometimes / manual","No","Not sure"], score:[3,2,1,1]},
    ]
  },
  {
    key:"people", name:"Your people", icon:"ti-users",
    title:"Your people & ways of working",
    sub:"Transformation succeeds or fails on people, not software. How ready is your team?",
    questions:[
      {id:"comfort", type:"single", dim:"people", q:"How comfortable is your team with digital tools?",
       opts:["Very comfortable","Fairly comfortable","Mixed","Not very comfortable"], score:[3,3,2,1]},
      {id:"adapt", type:"single", dim:"people", q:"When new tools are introduced, do staff adapt without much resistance?",
       opts:["Yes, easily","Usually","With difficulty","Not sure"], score:[3,2,1,1]},
      {id:"champion", type:"single", dim:"people", q:"Is there someone who enjoys tech and could champion new tools?",
       opts:["Yes, definitely","Maybe","No"], score:[3,2,1]},
      {id:"leaders", type:"single", dim:"people", q:"Do partners personally use digital tools day to day?",
       opts:["Yes, actively","Somewhat","Rarely"], score:[3,2,1]},
      {id:"training", type:"single", dim:"people", q:"Do you invest in digital-skills training for staff?",
       opts:["Yes, regularly","Occasionally","No"], score:[3,2,1]},
    ]
  },
  {
    key:"clients", name:"Your clients", icon:"ti-messages",
    title:"Your clients & how you engage them",
    sub:"How you communicate with clients today shapes the biggest growth opportunities.",
    questions:[
      {id:"comms", type:"multi", dim:"clients", q:"How do you mainly communicate with clients?",
       opts:["Online meetings (Zoom/Teams)","A client portal","Email","Phone / WhatsApp","In-person only"], scoreMap:{0:3,1:3,2:2,3:2,4:1}},
      {id:"asked", type:"single", dim:"clients", q:"Have clients asked for online access, e-signing, or video meetings?",
       opts:["Yes, often","Occasionally","No","Not sure"], score:[3,2,1,1]},
      {id:"portal", type:"single", dim:"clients", q:"Do you currently offer clients any online portal or dashboard?",
       opts:["Yes","In progress","No"], score:[3,2,1]},
      {id:"presence", type:"single", dim:"clients", q:"Do you have a firm website and active LinkedIn presence?",
       opts:["Both, active","One of them","Neither"], score:[3,2,1]},
      {id:"proactive", type:"single", dim:"clients", q:"Would you like to offer proactive advice (live dashboards, cash-flow & tax alerts)?",
       opts:["Yes, very interested","Maybe","Not a priority"], score:[3,2,1], aspiration:true},
    ]
  },
  {
    key:"cyber", name:"Security", icon:"ti-shield-lock",
    title:"Security & protecting data",
    sub:"Accounting firms are high-value targets. \u201CNot sure\u201D is a common, useful answer here.",
    questions:[
      {id:"mfa", type:"single", dim:"cyber", q:"Do you use an extra login step (a phone code or app) on email & key systems?",
       opts:["Yes, everywhere","Some systems","No","Not sure"], score:[3,2,1,1]},
      {id:"pwd", type:"single", dim:"cyber", q:"How are passwords managed?",
       opts:["A password manager","Remembered / written down","Often reused","Not sure"], score:[3,2,1,1]},
      {id:"antivirus", type:"single", dim:"cyber", q:"Is security software installed and updated on all devices?",
       opts:["Yes, all devices","Some","No","Not sure"], score:[3,2,1,1]},
      {id:"access", type:"single", dim:"cyber", q:"Do staff only access the client data they actually need?",
       opts:["Yes, role-based access","Mostly","Everyone sees everything","Not sure"], score:[3,2,1,1]},
      {id:"bec", type:"single", dim:"cyber", q:"If a client emailed to change bank details, would you verify by a second channel first?",
       opts:["Yes, always","Sometimes","No","Not sure"], score:[3,2,1,1]},
      {id:"incident", type:"single", dim:"cyber", q:"Do you have a written plan for a cyber incident?",
       opts:["Yes, tested","Yes, untested","No","Not sure"], score:[3,2,1,1]},
    ]
  },
  {
    key:"ndpa", name:"Compliance", icon:"ti-gavel",
    title:"Data privacy & NDPA compliance",
    sub:"Nigerian law (NDPA 2023) is binding, with penalties up to 2% of revenue or \u20A610m.",
    questions:[
      {id:"aware", type:"single", dim:"ndpa", q:"Are you familiar with the NDPA and your obligations?",
       opts:["Yes, familiar","Heard of it","No"], score:[3,2,1]},
      {id:"registered", type:"single", dim:"ndpa", q:"Are you registered with the NDPC (if required for your size)?",

/* ---- SECTION PANEL ---- */
function sectionPanel(si){
  const s = SECTIONS[si];
  let body = '';
  s.questions.forEach((q,qi)=>{
    const delay = (qi*0.06).toFixed(2);
    body += `<div class="field" style="animation-delay:${delay}s">`;
    if(q.type==='fields'){
      body += `<div class="grid2">`;
      q.fields.forEach(f=>{
        const v = (answers[q.id]&&answers[q.id][f.k])||'';
        body += `<div><label class="lbl">${f.label}</label>
          <input type="${f.type}" data-fid="${q.id}" data-fk="${f.k}" value="${v}" placeholder="${f.ph||''}" oninput="setField('${q.id}','${f.k}',this.value)"></div>`;
      });
      body += `</div>`;
    } else {
      body += `<div class="qtext">${q.q}${q.max?` <span class="opt">(up to ${q.max})</span>`:''}${q.type==='textarea'?` <span class="opt">— optional</span>`:''}</div>`;
      if(q.type==='single'||q.type==='multi'){
        const cls = q.opts.length>4||q.opts.some(o=>o.length>26)?'opts':'opts cols';
        body += `<div class="${cls}">`;
        q.opts.forEach((o,oi)=>{
          const sel = isSel(q,oi)?'sel':'';
          const shape = q.type==='single'?'radio':'';
          body += `<div class="opt-btn ${shape} ${sel}" data-q="${q.id}" data-oi="${oi}" onclick="pick('${si}','${q.id}',${oi},'${q.type}',${q.max||0})">
            <span class="tick"><i class="ti ti-check" style="${isSel(q,oi)?'':'opacity:0'}"></i></span><span>${o}</span></div>`;
        });
        body += `</div>`;
      } else if(q.type==='text'){
        body += `<input type="text" value="${answers[q.id]||''}" placeholder="${q.ph||''}" oninput="answers['${q.id}']=this.value">`;
      } else if(q.type==='textarea'){
        body += `<textarea placeholder="${q.ph||''}" oninput="answers['${q.id}']=this.value">${answers[q.id]||''}</textarea>`;
      }
    }
    body += `</div>`;
  });

  return `<div class="panel" data-p="${si}">
    <span class="eyebrow"><i class="ti ${s.icon}"></i> ${s.name}</span>
    <h2>${s.title}</h2>
    <p class="sub">${s.sub}</p>
    ${body}
    <div class="nav">
      <button class="btn ghost" onclick="go(${si})"><i class="ti ti-arrow-left"></i> Back</button>
      <button class="btn primary" onclick="next(${si})">${si===TOTAL?'See my results':'Continue'} <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>`;
}

function isSel(q,oi){
  const a=answers[q.id];
  if(q.type==='single') return a===oi;
  if(q.type==='multi') return Array.isArray(a)&&a.includes(oi);
  return false;
}

panelsEl.innerHTML = introPanel() + SECTIONS.map((_,i)=>sectionPanel(i)).join('') +

let receiptFile=null;
function onReceipt(input){
  const f=input.files&&input.files[0];
  if(!f){ return; }
  if(f.size>10*1024*1024){ toast('File is too large (max 10MB).'); input.value=''; return; }
  receiptFile=f;
  document.getElementById('upText').textContent=f.name;
  document.getElementById('uplabel').classList.add('hasfile');
}
function copyAcct(){
  const t=CONFIG.bank.account;
  if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast('Account number copied.')); }
  else { toast('Account number: '+t); }

/* ============ INTERACTION ============ */
function setField(qid,fk,val){ answers[qid]=answers[qid]||{}; answers[qid][fk]=val; }

function pick(si,qid,oi,type,max){
  if(type==='single'){ answers[qid]=oi; }
  else {
    answers[qid]=answers[qid]||[];
    const i=answers[qid].indexOf(oi);
    if(i>=0) answers[qid].splice(i,1);
    else {
      if(max&&answers[qid].length>=max){ toast(`You can pick up to ${max}.`); return; }
      answers[qid].push(oi);
    }
  }
  refreshPanel(+si);
}

function refreshPanel(si){
  const panel=document.querySelector(`.panel[data-p="${si}"]`);
  const wasShown=panel.classList.contains('show');
  panel.outerHTML=sectionPanel(si);
  const np=document.querySelector(`.panel[data-p="${si}"]`);
  if(wasShown){ np.classList.add('show'); np.style.animation='none'; }
}

function showPanel(p){
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('show'));
  let sel;
  if(p==='results') sel='#results';
  else if(p==='payment') sel='.panel[data-p="payment"]';
  else sel=`.panel[data-p="${p}"]`;
  const el=document.querySelector(sel);
  el.classList.add('show'); el.style.animation='';
  el.style.animation='slideUp .55s cubic-bezier(.16,.84,.44,1)';
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateProgress(){
  const shell=document.getElementById('progressShell');
  if(step>=1&&step<=TOTAL){
    shell.style.display='block';
    document.querySelectorAll('.steps .seg').forEach((seg,i)=>{
      seg.classList.toggle('done',i<step-1);
      seg.classList.toggle('active',i===step-1);
    });
    document.getElementById('stepName').textContent=SECTIONS[step-1].name;
    document.getElementById('stepCount').textContent=`Step ${step} of ${TOTAL}`;
  } else if(step===TOTAL+1){ // payment step
    shell.style.display='block';
    document.querySelectorAll('.steps .seg').forEach(seg=>{ seg.classList.add('done'); seg.classList.remove('active'); });
    document.getElementById('stepName').textContent='Payment & submit';
    document.getElementById('stepCount').textContent='Final step';
  } else { shell.style.display='none'; }
}

function go(p){ // go to step p: 0 = intro, 1..TOTAL = sections (panel data-p = p-1)
  step=p;
  if(p===0) showPanel('intro');
  else if(p>=1&&p<=TOTAL) showPanel(p-1);
  updateProgress();
}

function next(si){ // si is 0-based section index of current panel
  // light validation on first section
  if(si===0){
    const f=answers['firmName']||{};
    if(!f.firmName){ toast('Please add your firm name to continue.'); return; }
  }
  if(si<TOTAL-1){ step=si+2; showPanel(si+1); updateProgress(); }
  else { step=TOTAL+1; showPanel('payment'); updateProgress(); }  // last section -> payment
}

/* ============ SCORING ============ */
function scoreDimension(dim){
  let total=0,count=0;
  SECTIONS.forEach(s=>s.questions.forEach(q=>{
    if(q.dim!==dim) return;
    const a=answers[q.id];
    if(q.type==='single'&&q.score){
      if(a==null) return;
      total+=q.score[a]; count++;
    } else if(q.type==='multi'&&q.invert){
      // more ticked = worse. 0 ticked=3, all ticked=1
      const ticks=(a||[]).length, n=q.opts.length;
      const sc = n? 3 - (ticks/n)*2 : 3;
      total+=sc; count++;
    } else if(q.type==='multi'&&q.scoreMap){
      const arr=a||[]; if(!arr.length){ total+=1; count++; return; }
      let best=0; arr.forEach(i=>{ if(q.scoreMap[i]>best) best=q.scoreMap[i]; });
      total+=best; count++;
    }
  }));
  return count? total/count : 1.5;
}

/* ============ SUBMISSION ============ */
function labelFor(qid){
  for(const s of SECTIONS) for(const q of s.questions) if(q.id===qid) return q;
  return null;
}
function buildReadableAnswers(){
  // Returns an object of "Section — Question": "Answer" for easy email reading
  const out={};
  SECTIONS.forEach(s=>{
    s.questions.forEach(q=>{
      const a=answers[q.id];
      let val='(not answered)';
      if(q.type==='fields'){
        if(a) val=q.fields.map(f=>`${f.label}: ${a[f.k]||'-'}`).join(' | ');
      } else if(q.type==='single'){
        if(a!=null) val=q.opts[a];
      } else if(q.type==='multi'){
        if(Array.isArray(a)&&a.length) val=a.map(i=>q.opts[i]).join(', ');
        else val='(none)';
      } else if(q.type==='textarea'||q.type==='text'){
        if(a) val=a;
      }
      const key=`${s.name} — ${q.type==='fields'?'Firm details':q.q}`;
      out[key]=val;
    });
  });
  return out;
}
function scoreSnapshot(){
  const dims={}; Object.keys(DIM_META).forEach(d=>dims[d]=scoreDimension(d));
  const overall=Object.values(dims).reduce((a,b)=>a+b,0)/5;
  const snap={'Overall readiness':`${Math.round(overall/3*100)}% (${ragLabel(overall)})`};
  Object.keys(dims).forEach(d=> snap[DIM_META[d].label]=`${dims[d].toFixed(1)}/3 (${ragLabel(dims[d])})`);
  return {dims,overall,snap};
}

function buildPayload(firm, contact, readable, snap, includeFile){
  const fd=new FormData();
  fd.append('_subject', `New consultation intake — ${firm}`);
  fd.append('Firm', firm);
  fd.append('Contact', contact.contact||'');
  fd.append('Email', contact.email||'');
  fd.append('Phone', contact.phone||'');
  fd.append('Partners', contact.partners||'');
  fd.append('Staff', contact.staff||'');
  fd.append('Consultation total', CONFIG.feeTotal+' (incl. '+CONFIG.vatRate+' VAT)');
  fd.append('Payment confirmed by client', answers['_paid']?'Yes':'No');
  fd.append('Payment reference', answers['_payref']||'');
  fd.append('Receipt attached to this email', includeFile&&receiptFile?'Yes':'No (client to email/upload separately)');
  Object.keys(readable).forEach(k=> fd.append(k, readable[k]));
  Object.keys(snap).forEach(k=> fd.append('SCORE: '+k, snap[k]));
  if(includeFile&&receiptFile) fd.append('Proof of payment', receiptFile, receiptFile.name);
  if(contact.email) fd.append('email', contact.email); // Formspree reply-to
  return fd;
}

async function submitAll(){
  const firm=(answers['firmName']&&answers['firmName'].firmName)||'';
  if(!firm){ toast('Please complete your firm details first.'); go(1); return; }
  if(!answers['_payref']){ toast('Please enter your payment reference.'); return; }
  if(!answers['_paid']){ toast('Please tick the box to confirm you have paid.');
    const w=document.getElementById('confirmWrap'); if(w){ w.classList.add('shake'); setTimeout(()=>w.classList.remove('shake'),500);} return; }

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2 spin"></i> Submitting...';

  const readable=buildReadableAnswers();
  const {snap}=scoreSnapshot();
  const contact=answers['firmName']||{};

  // DEMO mode if no Formspree ID set
  if(!CONFIG.formspreeId || CONFIG.formspreeId==='YOUR_FORM_ID'){
    setTimeout(()=>{ btn.disabled=false; computeResults();
      toast('Demo mode: add your Formspree ID to receive responses.'); }, 800);
    return;
  }

  const endpoint='https://formspree.io/f/'+CONFIG.formspreeId;
  async function post(includeFile){
    return fetch(endpoint,{method:'POST',body:buildPayload(firm,contact,readable,snap,includeFile),headers:{'Accept':'application/json'}});
  }

  try{
    // First try with the file (works if your Formspree plan allows uploads)
    let res = await post(!!receiptFile);
    if(!res.ok && receiptFile){
      const j=await res.json().catch(()=>({}));
      const msg=(j.errors&&j.errors[0]&&j.errors[0].message)||'';
      // If uploads aren't permitted on the plan, retry WITHOUT the file so it still goes through
      if(/upload/i.test(msg)){ res = await post(false); }
      else throw new Error(msg||'Submission failed');
    }
    if(res.ok){ btn.disabled=false; computeResults(); }
    else {
      const j=await res.json().catch(()=>({}));
      throw new Error((j.errors&&j.errors[0]&&j.errors[0].message)||'Submission failed');
    }
  }catch(e){
    btn.disabled=false; btn.innerHTML='Submit & see my results <i class="ti ti-arrow-right"></i>';
    toast('Could not submit: '+e.message+'. Please try again.');
  }
}

function computeResults(){
  step=TOTAL+1;
  const dims={};
  Object.keys(DIM_META).forEach(d=> dims[d]=scoreDimension(d));
  const overall = Object.values(dims).reduce((a,b)=>a+b,0)/5;

  let tier,tierName,tierBlurb;
  if(overall<1.7){ tier='red'; tierName='Quick-Start foundation'; tierBlurb='Your firm has strong potential but key foundations need attention first. We recommend stabilising security & compliance and fixing critical gaps before scaling.'; }
  else if(overall<2.4){ tier='amber'; tierName='Standard transformation'; tierBlurb='You have a developing base to build on. A structured strategy with a piloted solution and cyber hardening will move you forward quickly.'; }
  else { tier='green'; tierName='Full transformation'; tierBlurb='You have a strong foundation. You\u2019re ready for firm-wide rollout, new advisory products, and an ongoing evolution partnership.'; }

  renderResults(dims,overall,tier,tierName,tierBlurb);
  showPanel('results'); updateProgress();
  launchConfetti();
}

function ragColor(v){ return v<1.7?'#C0392B':v<2.4?'#E67E22':'#00A651'; }
function ragLabel(v){ return v<1.7?'Needs attention':v<2.4?'Developing':'Strong'; }

function renderResults(dims,overall,tier,tierName,tierBlurb){
  const pct=Math.round((overall/3)*100);
  const gaugeColor=ragColor(overall);
  const firm=(answers['firmName']&&answers['firmName'].firmName)||'Your firm';

  // ordered dims worst-first for action focus
  const ordered=Object.keys(dims).sort((a,b)=>dims[a]-dims[b]);

  // risks (worst 2) & wins (best opportunities + aspirations)
  const risks=ordered.slice(0,2).map(d=>({
    title:DIM_META[d].label,
    text:riskText(d,dims[d])
  }));
  const wins=buildWins(dims);

  const dimsHtml=ordered.map((d,i)=>{
    const v=dims[d],p=Math.round((v/3)*100),col=ragColor(v),m=DIM_META[d];
    return `<div class="dim" style="animation-delay:${(i*0.08).toFixed(2)}s">
      <div class="ico" style="background:${hexA(col,.12)};color:${col}"><i class="ti ${m.icon}"></i></div>
      <div class="body">
        <div class="top"><h4>${m.label}</h4><span class="score" style="color:${col}">${ragLabel(v)} · ${v.toFixed(1)}/3</span></div>
        <div class="bar"><i style="background:${col}" data-w="${p}"></i></div>
      </div></div>`;
  }).join('');

  const roadmap=buildRoadmap(tier);
  const roadmapHtml=roadmap.map((ph,i)=>`
    <div class="phase" style="animation-delay:${(i*0.1).toFixed(2)}s">
      <div class="dot">${i+1}</div>
      <div class="pc"><h4>${ph.t}</h4><span class="dur">${ph.d}</span><p>${ph.p}</p></div>
    </div>`).join('');

  const risksHtml=risks.map((r,i)=>`<div class="reco risk" style="animation-delay:${(i*0.08).toFixed(2)}s">
    <i class="ti ti-alert-triangle"></i><div><b>${r.title}</b><p>${r.text}</p></div></div>`).join('');
  const winsHtml=wins.map((w,i)=>`<div class="reco" style="animation-delay:${(i*0.08).toFixed(2)}s">
    <i class="ti ti-bolt"></i><div><b>${w.title}</b><p>${w.text}</p></div></div>`).join('');

  document.getElementById('results').innerHTML=`
    <span class="eyebrow"><i class="ti ti-confetti"></i> Your results</span>
    <h2>${firm}'s readiness snapshot</h2>
    <p class="sub">Based on your answers, here's where your firm stands and what your transformation could look like.</p>

    <div class="gauge-wrap">
      <div class="gauge">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="68" fill="none" stroke="#e6e7ee" stroke-width="14"/>
          <circle id="gaugeArc" cx="80" cy="80" r="68" fill="none" stroke="${gaugeColor}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${(2*Math.PI*68).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*68).toFixed(1)}"/>
        </svg>
        <div class="val"><b id="gaugeNum" style="color:${gaugeColor}">0%</b><span>Ready</span></div>
      </div>
      <div class="rsummary">
        <div class="tier" style="color:${gaugeColor}">Recommended starting point</div>
        <h3>${tierName}</h3>
        <p>${tierBlurb}</p>
      </div>
    </div>

    <div class="dims">${dimsHtml}</div>

    <div class="roadmap">
      <h3>Your transformation roadmap</h3>
      ${roadmapHtml}
    </div>

    <h3 style="font-size:19px;font-weight:800;margin:4px 0 14px;letter-spacing:-.3px">Priorities to address first</h3>
    <div class="recos">${risksHtml}</div>

    <h3 style="font-size:19px;font-weight:800;margin:4px 0 14px;letter-spacing:-.3px">Your fastest quick wins</h3>
    <div class="recos">${winsHtml}</div>

    <div class="cta">
      <h3>Thank you — your responses are in.</h3>
      <p>We've received your answers and proof of payment for ${firm}. Our team will review everything and reach out within 1 business day to schedule your consultation and walk you through a tailored plan.</p>
      <div class="row">
        <button class="btn gold" onclick="downloadSummary()"><i class="ti ti-download"></i> Download my summary</button>
        <button class="btn outline" onclick="go(0)"><i class="ti ti-refresh"></i> Start over</button>
      </div>
    </div>`;

  // animate gauge + bars after paint
  requestAnimationFrame(()=>{ setTimeout(()=>{
    const arc=document.getElementById('gaugeArc');
    const circ=2*Math.PI*68;
    arc.style.transition='stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)';
    arc.style.strokeDashoffset = (circ*(1-pct/100)).toFixed(1);
    animateNum(document.getElementById('gaugeNum'),pct);
    document.querySelectorAll('.bar i').forEach(b=> b.style.width=b.dataset.w+'%');
  },120); });
}

function riskText(d,v){
  const T={
    tech:"Manual processes and fragmented data are slowing your team and creating error risk. Cloud consolidation and automation are the priority.",
    people:"Skills and change-readiness gaps could stall adoption. A structured training plan and a named digital champion come first.",
    clients:"Your client engagement is still largely traditional — a real opportunity, but also a retention risk as competitors digitise.",
    cyber:"Your security posture leaves the firm exposed to BEC, ransomware and phishing. MFA, access controls and an incident plan are urgent.",
    ndpa:"NDPA gaps create legal and financial exposure (penalties up to 2% of revenue or \u20A610m). Compliance documentation should be addressed immediately."
  };
  return T[d];
}
function buildWins(dims){
  const wins=[];
  if((answers['manual']||[]).length) wins.push({title:"Automate manual work",text:"You flagged tasks still done by hand. Automating invoicing, reconciliations and payroll frees real capacity fast."});
  if(answers['mfa']!==0) wins.push({title:"Turn on multi-factor authentication",text:"Enabling MFA everywhere is the single highest-impact, lowest-cost security step — deployable in days."});
  if(answers['portal']!==0) wins.push({title:"Launch a client portal",text:"A branded portal for documents, dashboards and e-signature instantly modernises the client experience."});
  if(answers['aware']!==0||answers['record']!==0) wins.push({title:"Start your NDPA compliance file",text:"Documenting lawful basis, vendor agreements and a data record closes your biggest compliance gaps."});
  if(answers['proactive']===0) wins.push({title:"Offer proactive advisory",text:"You're keen on this — live dashboards for cash flow and tax deadlines turn you into a year-round trusted advisor."});
  if(wins.length<3) wins.push({title:"Centralise your data",text:"Moving files to a secure, searchable cloud workspace ends scattered email and folders."});
  return wins.slice(0,4);
}
function buildRoadmap(tier){
  const base=[
    {t:"Readiness assessment",d:"Weeks 1–2",p:"We turn this snapshot into a detailed diagnostic with a risk heat-map and prioritised opportunities."},
    {t:"Strategy & quick wins",d:tier==='red'?"Weeks 2–6":"Weeks 3–6",p:"Lock in fast security & compliance wins, agree your digital vision, and shortlist the right tools."},
    {t:"Pilot implementation",d:tier==='red'?"—":"Months 2–3",p:"Deploy in one service line, prove the value, and gather staff & client feedback before scaling."},
    {t:"Firm-wide rollout",d:tier==='green'?"Months 3–6":"Later phase",p:"Expand across all service lines with full change management and staff training."},
    {t:"Continuous evolution",d:"Ongoing",p:"Quarterly innovation reviews, monitoring and upskilling so your firm keeps getting ahead."},
  ];
  if(tier==='red') return base.slice(0,3).concat([base[4]]);
  if(tier==='amber') return base.slice(0,4);
  return base;
}

/* ============ HELPERS ============ */
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function animateNum(el,target){let c=0;const step=Math.max(1,Math.round(target/40));
  const t=setInterval(()=>{c+=step;if(c>=target){c=target;clearInterval(t);}el.textContent=c+'%';},28);}
function launchConfetti(){
  const cols=['#2E3192','#1CA8DD','#00A651','#C9A35B','#7F77DD'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.opacity=0.9;c.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(c);
    const dur=2200+Math.random()*1600, x=(Math.random()-0.5)*200;
    c.animate([{transform:`translate(0,0) rotate(0)`,opacity:1},
      {transform:`translate(${x}px,${window.innerHeight+60}px) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:dur,easing:'cubic-bezier(.4,.2,.6,1)'}).onfinish=()=>c.remove();
  }
}


function downloadSummary(){
  const firm=(answers['firmName']&&answers['firmName'].firmName)||'Your firm';
  const dims={}; Object.keys(DIM_META).forEach(d=>dims[d]=scoreDimension(d));
  const overall=(Object.values(dims).reduce((a,b)=>a+b,0)/5);
  let txt=`DIGITAL TRANSFORMATION READINESS SUMMARY\n${firm}\n${new Date().toLocaleDateString()}\n\n`;
  txt+=`Overall readiness: ${Math.round(overall/3*100)}% (${ragLabel(overall)})\n\nDimension scores:\n`;
  Object.keys(dims).forEach(d=> txt+=`  • ${DIM_META[d].label}: ${dims[d].toFixed(1)}/3 (${ragLabel(dims[d])})\n`);
  txt+=`\nThis summary was generated from the client intake questionnaire.\nA detailed assessment and tailored proposal follow your consultation.\n`;
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${firm.replace(/[^a-z0-9]+/gi,'_')}_readiness_summary.txt`;a.click();
  toast('Summary downloaded.');
}

/* ============ INIT ============ */
go(0);
</script>
